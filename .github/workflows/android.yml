name: ClamGuard Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: ./build-tools/build-apk.sh

      - name: Verify APK artifact
        run: test -f build/clamguard-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clamguard-debug-apk
          path: build/clamguard-debug.apk
          if-no-files-found: error
